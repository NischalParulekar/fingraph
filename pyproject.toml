[project]
name = "fingraph"
version = "0.1.0"
description = "Does LangGraph orchestration beat a single tool-loop agent on hybrid table+text financial QA (TAT-QA)?"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.11.0",
    "duckdb>=2.0.0",
    "langchain-core>=1.8.4",
    "langchain-postgres>=0.0.19",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-postgres>=3.2.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "scipy>=1.18.1",
    "sentence-transformers>=6.3.0",
    "torch>=2.15.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.16",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fingraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The vendored official scorer has invalid escape sequences in plain strings; harmless.
filterwarnings = ["ignore::SyntaxWarning"]

[tool.ruff]
line-length = 100
extend-exclude = ["fingraph/eval/tatqa_official"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# A table of hand-written labels and notes; wrapping each note would not help reading it.
"fingraph/eval/error_labels.py" = ["E501"]

# CPU-only PyTorch (pulled in by sentence-transformers): the default Linux wheel brings
# gigabytes of CUDA that a laptop and CI don't need.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
