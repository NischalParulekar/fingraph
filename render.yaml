# Render Blueprint for the live API: one free Docker web service and one free Postgres
# (LangGraph checkpoints for Arm C's human review). Render asks for ANTHROPIC_API_KEY and
# REDIS_URL when it creates the service; neither is stored in this repository.
#
# Redis: Render allows one free Key Value instance per workspace, and tableqa's
# (tableqa-redis) is it. FinGraph shares that instance: set REDIS_URL to its internal
# connection string (tableqa-redis > Connect > Internal). The two never collide, because
# every FinGraph key starts with "fingraph:" and every tableqa key with "tableqa:".
#
# Free-tier limits that matter here:
# - the web service has 512 MB, sleeps after 15 minutes without traffic and takes about
#   a minute to wake; the image uses the ONNX embedder so it fits (see the Dockerfile);
# - the free Key Value instance keeps no data across restarts, which clears the cache
#   and today's spend counter, so set a spend limit in the Anthropic Console as well:
#   that is the hard ceiling. Its 25 MB are shared with tableqa;
# - the free Postgres expires 30 days after it is created. Without it the API switches
#   Arm C off by itself and keeps serving Arms A and B.
services:
  - type: web
    name: fingraph-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      # The internal connection string of tableqa-redis (see above).
      - key: REDIS_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: fingraph-db
          property: connectionString
      - key: DAILY_SPEND_CAP_USD
        value: "0.50"
      # Questions answered at once. Four peaked at 382 MB in the slim image; two leave
      # more of the 512 MB free.
      - key: FINGRAPH_CONCURRENCY
        value: "2"
      - key: CORS_ORIGINS
        value: https://nischalparulekar.github.io
      # Render's load balancer adds a changing internal address to X-Forwarded-For;
      # requests also pass through Cloudflare, which sets CF-Connecting-IP to the client
      # (as found when deploying tableqa).
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: fingraph-db
    plan: free
    databaseName: fingraph
    user: fingraph
    ipAllowList: []
