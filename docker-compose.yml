# Local stack: the API, Postgres 16 + pgvector (LangGraph checkpoints and paragraph
# vectors), Redis (answer cache, rate limits, daily spend), Prometheus and Grafana.
# Every port is bound to this machine only. The Anthropic key comes from the
# git-ignored .env file.
#
#   docker compose up -d postgres          just the database (tests, make db)
#   docker compose up -d --build           the whole stack
#   docker compose down                    (add -v to drop the data volume)
#
# API http://localhost:8000/docs, Prometheus :9090, Grafana :3001.

services:
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://fingraph:fingraph@postgres:5432/fingraph
      DAILY_SPEND_CAP_USD: "0.50"
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 30

  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_USER: fingraph
      POSTGRES_PASSWORD: fingraph  # local development only
      POSTGRES_DB: fingraph
    ports:
      - "127.0.0.1:5433:5432"  # 5433 so it cannot clash with a Postgres already on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fingraph -d fingraph"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4.1-alpine
    # noeviction: evicting keys could reset the daily spend counter or rate limits.
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6380:6379"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [api]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/fingraph.json
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
